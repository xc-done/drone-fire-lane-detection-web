# Fire escape channel detection dataset (3 classes)
#
# This file is generated by scripts/prepare_fly_dataset.py, which also writes
# manifest.json / splits.json next to the split folders.
#
# `path` MUST be the absolute path to the folder that holds images/ and labels/.
# Ultralytics resolves a *relative* path against its global datasets_dir, which
# silently duplicates the prefix (datasets/datasets/...) and makes training fail.
path: /absolute/path/to/datasets/fly_yolo
train: images/train
val: images/val
test: images/test
nc: 3
names:
  0: "car"
  1: "fire escape occupation"
  2: "non-motorized vehicle"
